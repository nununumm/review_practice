## ============================================================
##  日次売上レポート機能の設定（環境で変わる値・業務ルールの値）
##  ・ここは「名前 = 値」を書くだけのテキストファイル。アノテーションは一切書かない。
##  ・Java側から @Value("${名前}") で呼び出す。
##  ・値を変えたいときは、この1行を直すだけ。コードの再ビルドは不要。
## ============================================================

## レポートの出力先フォルダ（★環境依存：本番Linuxなら /var/reports などに差し替える）
report.output-dir=C:\\reports

## 高額売上を通知するメールの宛先（★人事異動で変わるのでコードに埋めない）
report.notify-email=keiri-bucho@example.com

## 消費税率（★法改正で変わりうる業務ルールの値）
report.tax-rate=1.1

## 通知を送る売上のしきい値（円）（★経営判断で変わりうる業務ルールの値）
report.notify-threshold=1000000
